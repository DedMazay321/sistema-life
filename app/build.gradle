plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ru.sistema.player'
    compileSdk 35

    defaultConfig {
        applicationId "ru.sistema.player"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    signingConfigs {
        release {
            def storePath = System.getenv("SISTEMA_KEYSTORE_PATH")
            if (storePath != null && !storePath.isBlank()) {
                storeFile file(storePath)
                storePassword System.getenv("SISTEMA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SISTEMA_KEY_ALIAS")
                keyPassword System.getenv("SISTEMA_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("SISTEMA_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
