name: Android release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SISTEMA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing SISTEMA_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sistema.jks"

      - name: Build signed APK
        env:
          SISTEMA_KEYSTORE_PATH: ${{ runner.temp }}/sistema.jks
          SISTEMA_KEYSTORE_PASSWORD: ${{ secrets.SISTEMA_KEYSTORE_PASSWORD }}
          SISTEMA_KEY_ALIAS: ${{ secrets.SISTEMA_KEY_ALIAS }}
          SISTEMA_KEY_PASSWORD: ${{ secrets.SISTEMA_KEY_PASSWORD }}
        run: |
          test -n "$SISTEMA_KEYSTORE_PASSWORD" && test -n "$SISTEMA_KEY_ALIAS" && test -n "$SISTEMA_KEY_PASSWORD"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Sistema.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Sistema.apk
