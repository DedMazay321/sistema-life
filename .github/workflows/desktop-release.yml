name: Desktop release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows application
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.22.3
          python -m PyInstaller --noconfirm desktop/Sistema.spec

      - name: Attach Windows build to the Android release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --generate-notes }
          gh release upload $env:GITHUB_REF_NAME dist/Sistema.exe --clobber
